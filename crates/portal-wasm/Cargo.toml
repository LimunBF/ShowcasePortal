[package]
name = "portal-wasm"
version = "0.1.0"
edition = "2021"
description = "Fuzzy search, filtering and telemetry scoring engine for the DevArcade portal."
license = "MIT"
repository = "https://github.com/LimunBF/ShowcasePortal"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
